name: Build Clean Panel and Train Boom Classifier

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 0"

permissions:
  contents: write

jobs:
  build-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download data and build clean panel
        run: |
          python src/download_data.py
          python src/build_clean_panel.py
          python src/check_panel.py
      - name: Train boom classifier and backtest
        run: |
          python src/train_boom_classifier.py
          python src/backtest_boom_strategy.py
          python src/update_readme.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/universe.csv data/prices_daily.csv outputs/*.csv outputs/*.xlsx outputs/*.txt models/*.json
          git commit -m "Build clean momentum panel and train boom classifier" || echo "No changes to commit"
          git push
